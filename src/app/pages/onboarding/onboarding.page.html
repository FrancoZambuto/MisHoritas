<ion-content class="onboarding-content" [fullscreen]="true">
  <div class="onboarding-container">
    <div class="hero-section">
      <img src="assets/MisHoritas.png" alt="MisHoritas" class="logo-image" />
      <p class="subtitle">{{ 'onboarding.subtitle' | translate }}</p>
    </div>

    <div class="features-section">
      <div class="feature">
        <div class="feature-icon-badge">
          <ion-icon name="calendar-outline"></ion-icon>
        </div>
        <span>{{ 'onboarding.feature_hours' | translate }}</span>
      </div>
      <div class="feature">
        <div class="feature-icon-badge">
          <ion-icon name="business-outline"></ion-icon>
        </div>
        <span>{{ 'onboarding.feature_establishments' | translate }}</span>
      </div>
      <div class="feature">
        <div class="feature-icon-badge">
          <ion-icon name="calculator-outline"></ion-icon>
        </div>
        <span>{{ 'onboarding.feature_billing' | translate }}</span>
      </div>
    </div>

    <div class="action-section">
      <ion-button
        expand="block"
        size="large"
        (click)="openWizard()"
        class="start-btn"
      >
        {{ 'common.start' | translate }}
        <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
      </ion-button>
    </div>
  </div>
</ion-content>
